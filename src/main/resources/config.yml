# =====================================
# KitPlugin - konfiguracja
# =====================================

# Prefix wiadomości (kolor kodu &)
prefix: "&8[&eKity&8] &r"

# Wiadomości
messages:
  no-permission: "&cNie masz uprawnien!"
  kit-created: "&aUtworzono kit &e%kit%&a!"
  kit-exists: "&cKit o nazwie &e%kit% &cjuz istnieje!"
  kit-not-found: "&cNie znaleziono kitu: &e%kit%"
  kit-received: "&aOtrzymales kit &e%kit%&a!"
  kit-saved: "&aKit &e%kit% &azostal zapisany!"
  kit-auto-saved: "&aKit &e%kit% &azostal automatycznie zapisany."
  edit-cancelled: "&cAnulowano edycje."
  player-only: "&cTylko gracz moze uzywac tej komendy!"
  usage-create: "&cUzycie: /kit create [nazwa] [item]"
  usage-edit: "&cUzycie: /kit edit [nazwa]"
  invalid-item: "&cNieprawidlowy item: &e%item%"
  no-kits: "&7Brak dostepnych kitow."
  no-permission-kit: "&cNie masz uprawnien do tego kitu!"

# Cooldown w sekundach (0 = brak cooldownu)
cooldown-seconds: 60

# Wiadomość o cooldownie (%time% = pozostały czas w sekundach)
cooldown-message: "&cPoczekaj jeszcze &e%time%s &cprzed kolejnym odbiorem kitu &e%kit%&c!"

# Permisje (jesli gracz nie ma uprawnien, sprawdzane jest czy OP)
permissions:
  # Uprawnienie do otwarcia menu /kit
  use: "kitplugin.use"
  # Uprawnienie do tworzenia kitow
  create: "kitplugin.create"
  # Uprawnienie do edycji kitow
  edit: "kitplugin.edit"
  # Uprawnienie do usuwania kitow
  delete: "kitplugin.delete"
  # Uprawnienie do odbierania kitow (globalne - oprocz per-kit)
  receive: "kitplugin.receive"
  # Jesli true - gracz bez uprawnien nie moze uzywac pluginu
  enforce: false

# Ustawienia
settings:
  # Czy itemy maja wypadac na ziemie gdy eq pelny?
  drop-on-full-inventory: true
  # Czy auto-zapis przy zamknieciu edytora?
  auto-save-on-close: true

# =====================================
# USUWANIE KITU
# =====================================
